# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json
imports:
  errors: ./errors.yml

service:
  auth: true
  base-path: /api/public/unstable
  endpoints:
    getStatus:
      docs: |
        Get the evaluation job status of an experiment run.

        Use this to decide whether scoring has finished before reading scores,
        instead of polling the scores themselves.

        Job statuses:
        - `PENDING` — scheduled, waiting for an executor
        - `DELAYED` — failed with a retryable model error, waiting to be retried
        - `COMPLETED` — finished and produced a score
        - `ERROR` — failed permanently
        - `CANCELLED` — stopped before producing a score

        `PENDING` and `DELAYED` are the in-flight states. `COMPLETED` means the
        score was handed to ingestion, not that it is already queryable, so
        allow a short grace period before reading scores.

        The experiment run is not validated: an unknown experiment reports all
        counts as `0`.
      method: GET
      path: /evaluation-jobs/status
      request:
        name: GetEvaluationJobStatusRequest
        query-parameters:
          experimentId:
            type: string
            docs: Experiment run identifier (= dataset run id) to inspect.
      response: ExperimentEvaluationJobStatus
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError

    cancel:
      docs: |
        Cancel the evaluation jobs of an experiment run.

        Cancels every job of the experiment that has not started yet, i.e. jobs
        in `PENDING` or `DELAYED`. Cancelled jobs stay in the evaluation log and
        are short-circuited by the executor, so they neither call the model nor
        produce a score.

        Jobs that are already executing are not preempted and may still finish
        and produce a score. Completed, failed, and already cancelled jobs are
        left untouched, so the call is idempotent.
      method: POST
      path: /evaluation-jobs/cancel
      request: CancelEvaluationJobsRequest
      response: CancelEvaluationJobsResponse
      errors:
        - errors.BadRequestError
        - errors.UnauthorizedError
        - errors.AccessDeniedError
        - errors.MethodNotAllowedError
        - errors.TooManyRequestsError
        - errors.InternalServerError

types:
  ExperimentEvaluationJobStatus:
    docs: Evaluation job counts of an experiment run, grouped by job status.
    properties:
      experimentId:
        type: string
        docs: Experiment run identifier (= dataset run id) that was inspected.
      byStatus:
        type: map<string, integer>
        docs: |
          Number of evaluation jobs per job status. Always contains the keys
          `PENDING`, `DELAYED`, `COMPLETED`, `ERROR`, and `CANCELLED`, using `0`
          for statuses that do not occur.
    examples:
      - value:
          experimentId: exp_123
          byStatus:
            PENDING: 0
            DELAYED: 4
            COMPLETED: 236
            ERROR: 0
            CANCELLED: 0

  CancelEvaluationJobsRequest:
    properties:
      experimentId:
        type: string
        docs: Experiment run identifier (= dataset run id) whose not-yet-started evaluation jobs should be cancelled.
    examples:
      - value:
          experimentId: exp_123

  CancelEvaluationJobsResponse:
    properties:
      experimentId:
        type: string
        docs: Experiment run identifier (= dataset run id) whose jobs were cancelled.
      cancelled:
        type: integer
        docs: Number of evaluation jobs moved to `CANCELLED` by this call.
    examples:
      - value:
          experimentId: exp_123
          cancelled: 4
